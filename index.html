<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXORA 2026 — Turbo Gate Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060608;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      padding: 6px 0;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
    }

    h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .scanner-card {
      background: #0e0e12;
      border: 1.5px solid #2a2410;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: none !important;
    }

    #reader video {
      border-radius: 8px;
      object-fit: cover;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-start {
      background: linear-gradient(135deg, #f5e3a9 0%, #d4af37 100%);
      color: #08080a;
    }

    .btn-stop {
      background: #1f1f26;
      color: #cbd5e1;
      border: 1px solid #33333d;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Status Display Banner */
    .status-banner {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      display: none;
    }

    .status-banner.loading {
      display: block;
      background: #1e1b10;
      color: #facc15;
      border: 1px solid #715918;
    }

    .status-banner.success {
      display: block;
      background: #062312;
      color: #4ade80;
      border: 1px solid #16a34a;
    }

    .status-banner.error {
      display: block;
      background: #270d0d;
      color: #f87171;
      border: 1px solid #dc2626;
    }

    /* Card Details */
    .result-card {
      background: #0d0d11;
      border: 1.5px solid #d4af37;
      border-radius: 10px;
      padding: 14px 16px;
      display: none;
    }

    .result-card.active { display: block; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #2e2612;
    }

    .reg-tag {
      font-size: 15px;
      font-weight: 900;
      color: #ffd700;
    }

    .entry-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 800;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }

    .row-key {
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
    }

    .row-val {
      font-weight: 700;
      color: #ffffff;
      text-align: right;
    }

    .manual-box {
      background: #0e0e12;
      border: 1px solid #22222a;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 6px;
    }

    .manual-box input {
      flex: 1;
      background: #050507;
      border: 1px solid #2d2d38;
      border-radius: 6px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }

    .manual-box button {
      flex: 0 0 75px;
      background: #1f1f26;
      color: #f5e3a9;
      border: 1px solid #453916;
      padding: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">Multi-Gate Entrance</div>
      <h1>NEXORA 2026</h1>
    </header>

    <div class="scanner-card">
      <div id="reader"></div>
      <div class="controls">
        <button id="btnStart" class="btn-start" onclick="startScanner()">Start Camera</button>
        <button id="btnStop" class="btn-stop" onclick="stopScanner()" disabled>Stop</button>
      </div>
    </div>

    <div id="statusBanner" class="status-banner"></div>

    <div id="resultCard" class="result-card">
      <div class="result-header">
        <div id="resRegId" class="reg-tag">—</div>
        <div id="resBadge" class="entry-badge">—</div>
      </div>
      <div class="row">
        <span class="row-key">Attendee</span>
        <span id="resName" class="row-val">—</span>
      </div>
      <div class="row">
        <span class="row-key">Department</span>
        <span id="resDept" class="row-val">—</span>
      </div>
      <div class="row">
        <span class="row-key">Category</span>
        <span id="resCategory" class="row-val">—</span>
      </div>
    </div>

    <div class="manual-box">
      <input type="text" id="manualInput" placeholder="Enter Reg ID or QR code manually" />
      <button onclick="handleManualSubmit()">Check</button>
    </div>
  </div>

  <script>
    const SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzuedu5sFwgdu4j26oB8x-tmSKUClbdnIX-e2-ckEx59j8UhHMh96xxgp7E-zsOwwva/exec";
    const SCANNER_API_KEY    = "NEXORA_SECURE_SCAN_KEY_2026_x9F2";

    let html5QrCode = null;
    let isProcessing = false;
    let lastScanTime = 0;

    async function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { 
        fps: 20, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess
        );
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnStop").disabled = false;
        showStatus("Ready to scan. Point at QR code...", "loading");
      } catch (err) {
        showStatus("Camera error: " + err, "error");
      }
    }

    async function stopScanner() {
      if (html5QrCode) {
        await html5QrCode.stop();
        html5QrCode.clear();
        document.getElementById("btnStart").disabled = false;
        document.getElementById("btnStop").disabled = true;
        hideStatus();
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (isProcessing || (now - lastScanTime < 1500)) return;
      verifyPass(decodedText);
    }

    function handleManualSubmit() {
      const code = document.getElementById("manualInput").value.trim();
      if (!code) return;
      verifyPass(code);
    }

    // JSONP request handler: Immune to CORS and 302 redirect browser drops
    function jsonpFetch(url) {
      return new Promise((resolve, reject) => {
        const callbackName = "jsonp_cb_" + Math.round(100000 * Math.random());
        const script = document.createElement("script");

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out."));
        }, 8000);

        function cleanup() {
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          clearTimeout(timeout);
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
        script.onerror = function() {
          cleanup();
          reject(new Error("Connection error to server."));
        };

        document.body.appendChild(script);
      });
    }

    async function verifyPass(qrString) {
      isProcessing = true;
      lastScanTime = Date.now();
      showStatus("Checking pass...", "loading");

      try {
        const queryUrl = SCRIPT_WEB_APP_URL + 
          "?apiKey=" + encodeURIComponent(SCANNER_API_KEY) +
          "&qrCode=" + encodeURIComponent(qrString.trim());

        const data = await jsonpFetch(queryUrl);

        if (data.success) {
          playAudioTone(880, 0.12);
          vibrateDevice([60]);
          showStatus("✅ PASS VERIFIED — ENTER", "success");
          displayResult(data.attendee, false);
        } else {
          playAudioTone(250, 0.35);
          vibrateDevice([150, 100, 150]);
          const errorMsg = data.duplicate ? "⚠️ " + data.message : "❌ " + data.message;
          showStatus(errorMsg, "error");
          if (data.attendee) displayResult(data.attendee, true);
        }
      } catch (err) {
        showStatus("Network Error: " + err.message, "error");
      } finally {
        setTimeout(() => {
          isProcessing = false;
          hideStatus();
        }, 1200);
      }
    }

    function displayResult(att, isDuplicate) {
      const card = document.getElementById("resultCard");
      const badge = document.getElementById("resBadge");

      document.getElementById("resRegId").innerText = att.regId || "N/A";
      document.getElementById("resName").innerText = att.name || "N/A";
      document.getElementById("resDept").innerText = (att.dept || "") + (att.sem ? " (" + att.sem + ")" : "");
      document.getElementById("resCategory").innerText = att.category || "General";

      if (isDuplicate) {
        badge.innerText = "ALREADY ENTERED";
        badge.style.background = "rgba(239, 68, 68, 0.2)";
        badge.style.color = "#f87171";
        badge.style.border = "1px solid #ef4444";
      } else {
        badge.innerText = "ENTRY GRANTED";
        badge.style.background = "rgba(34, 197, 94, 0.2)";
        badge.style.color = "#4ade80";
        badge.style.border = "1px solid #22c55e";
      }

      card.classList.add("active");
    }

    function showStatus(msg, type) {
      const el = document.getElementById("statusBanner");
      el.className = "status-banner " + type;
      el.innerText = msg;
    }

    function hideStatus() {
      const el = document.getElementById("statusBanner");
      el.className = "status-banner";
      el.innerText = "";
    }

    function playAudioTone(freq, duration) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (_) {}
    }

    function vibrateDevice(pattern) {
      if ("vibrate" in navigator) {
        navigator.vibrate(pattern);
      }
    }
  </script>
</body>
</html>
