<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXORA 2026 — Gate Scanner</title>
  <!-- Fast, lightweight client-side QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070709;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 12px 0 6px;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* Scanner Viewport */
    .scanner-card {
      background: #0e0e12;
      border: 1.5px solid #2a2410;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      position: relative;
    }

    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: none !important;
    }

    #reader video {
      border-radius: 10px;
      object-fit: cover;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start {
      background: linear-gradient(135deg, #f5e3a9 0%, #d4af37 100%);
      color: #08080a;
    }

    .btn-stop {
      background: #1f1f26;
      color: #cbd5e1;
      border: 1px solid #33333d;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Status Display Banner */
    .status-banner {
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      display: none;
    }

    .status-banner.loading {
      display: block;
      background: #1e1b10;
      color: #facc15;
      border: 1px solid #715918;
    }

    .status-banner.success {
      display: block;
      background: #062312;
      color: #4ade80;
      border: 1px solid #15803d;
    }

    .status-banner.error {
      display: block;
      background: #270d0d;
      color: #f87171;
      border: 1px solid #991b1b;
    }

    /* Result Details Card */
    .result-card {
      background: #0e0e12;
      border: 1.5px solid #d4af37;
      border-radius: 12px;
      padding: 18px 20px;
      display: none;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
    }

    .result-card.active {
      display: block;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #2e2612;
    }

    .reg-tag {
      font-size: 15px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 1px;
    }

    .entry-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #4ade80;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }

    .row-key {
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .row-val {
      font-weight: 700;
      color: #ffffff;
      text-align: right;
    }

    /* Manual Input Section */
    .manual-box {
      margin-top: 6px;
      background: #0e0e12;
      border: 1px solid #22222a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .manual-box input {
      flex: 1;
      background: #050507;
      border: 1px solid #2d2d38;
      border-radius: 6px;
      padding: 10px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }

    .manual-box input:focus {
      border-color: #d4af37;
    }

    .manual-box button {
      flex: 0 0 90px;
      background: #1f1f26;
      color: #f5e3a9;
      border: 1px solid #453916;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">Entrance Verification</div>
      <h1>NEXORA 2026</h1>
    </header>

    <!-- Camera Scanner Box -->
    <div class="scanner-card">
      <div id="reader"></div>
      <div class="controls">
        <button id="btnStart" class="btn-start" onclick="startScanner()">Start Camera</button>
        <button id="btnStop" class="btn-stop" onclick="stopScanner()" disabled>Stop</button>
      </div>
    </div>

    <!-- Live Status Banner -->
    <div id="statusBanner" class="status-banner"></div>

    <!-- Verified Pass Information -->
    <div id="resultCard" class="result-card">
      <div class="result-header">
        <div id="resRegId" class="reg-tag">NEXORA26-000</div>
        <div id="resBadge" class="entry-badge">VERIFIED</div>
      </div>
      <div class="row">
        <span class="row-key">Attendee</span>
        <span id="resName" class="row-val">—</span>
      </div>
      <div class="row">
        <span class="row-key">Department</span>
        <span id="resDept" class="row-val">—</span>
      </div>
      <div class="row">
        <span class="row-key">Category</span>
        <span id="resCategory" class="row-val">—</span>
      </div>
      <div class="row">
        <span class="row-key">Entry Time</span>
        <span id="resTime" class="row-val">—</span>
      </div>
    </div>

    <!-- Manual Code Fallback -->
    <div class="manual-box">
      <input type="text" id="manualInput" placeholder="Manual QR or Reg ID (e.g. QR5281028432126)" />
      <button onclick="handleManualSubmit()">Verify</button>
    </div>
  </div>

  <script>
    // Paste your Google Apps Script Web App Deployment URL here:
    const SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqYSMR3xbhh-N3aDSv-qkWO0EX06CuR2vB_E9p5X5iZBngGaefAtPwjpamapC8TPU1/exec";

    let html5QrCode = null;
    let isProcessing = false;

    async function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 230, height: 230 } };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess
        );
        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnStop").disabled = false;
        showStatus("Point camera at pass QR code...", "loading");
      } catch (err) {
        showStatus("Camera error: " + err, "error");
      }
    }

    async function stopScanner() {
      if (html5QrCode) {
        await html5QrCode.stop();
        html5QrCode.clear();
        document.getElementById("btnStart").disabled = false;
        document.getElementById("btnStop").disabled = true;
        hideStatus();
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      verifyPass(decodedText);
    }

    function handleManualSubmit() {
      const code = document.getElementById("manualInput").value.trim();
      if (!code) return;
      verifyPass(code);
    }

    async function verifyPass(qrString) {
      isProcessing = true;
      showStatus("Validating ticket with database...", "loading");
      hideResultCard();

      // Audio feedback (beep)
      playBeep();

      try {
        const response = await fetch(SCRIPT_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ qrCode: qrString.trim() })
        });

        const data = await response.json();

        if (data.success) {
          showStatus("✅ " + data.message, "success");
          displayResult(data.attendee);
        } else {
          const reasonMsg = data.duplicate
            ? "⚠️ DUPLICATE ENTRY: " + data.message
            : "❌ " + data.message;
          showStatus(reasonMsg, "error");

          if (data.attendee) {
            displayResult(data.attendee, true);
          }
        }
      } catch (err) {
        showStatus("Connection error: " + err.message, "error");
      } finally {
        // Cooldown timer to prevent scanning the same code multiple times instantly
        setTimeout(() => {
          isProcessing = false;
        }, 2500);
      }
    }

    function displayResult(att, isDuplicate = false) {
      const card = document.getElementById("resultCard");
      const badge = document.getElementById("resBadge");

      document.getElementById("resRegId").innerText = att.regId || "N/A";
      document.getElementById("resName").innerText = att.name || "N/A";
      document.getElementById("resDept").innerText = (att.dept || "") + (att.sem ? " (" + att.sem + ")" : "");
      document.getElementById("resCategory").innerText = att.category || "General";
      document.getElementById("resTime").innerText = att.entryTime || "Recorded Just Now";

      if (isDuplicate) {
        badge.innerText = "ALREADY USED";
        badge.style.background = "rgba(239, 68, 68, 0.2)";
        badge.style.borderColor = "#ef4444";
        badge.style.color = "#f87171";
      } else {
        badge.innerText = "ENTRY GRANTED";
        badge.style.background = "rgba(34, 197, 94, 0.2)";
        badge.style.borderColor = "#22c55e";
        badge.style.color = "#4ade80";
      }

      card.classList.add("active");
    }

    function hideResultCard() {
      document.getElementById("resultCard").classList.remove("active");
    }

    function showStatus(msg, type) {
      const el = document.getElementById("statusBanner");
      el.className = "status-banner " + type;
      el.innerText = msg;
    }

    function hideStatus() {
      const el = document.getElementById("statusBanner");
      el.className = "status-banner";
      el.innerText = "";
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (_) {}
    }
  </script>
</body>
</html>
